name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 es la versión documentada del backend; 3.14 la de desarrollo local.
        python-version: ["3.13", "3.14"]
    env:
      # SQLite temporal del test runner; sin servicios externos ni secretos.
      DEBUG: "True"
      DATABASE_URL: ""
      AI_SERVICE_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración
        run: python manage.py check

      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        run: python manage.py test
